name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "src/content/**"
  workflow_dispatch:

# Read-only by default. The deploy job opts in to what it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Cache timeline data
        uses: actions/cache@v6
        with:
          path: src/data/timeline-github.json
          key: timeline-${{ github.sha }}
          restore-keys: |
            timeline-

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run check

      # Non-blocking: on failure the build falls back to the cached JSON,
      # then to local git history (see scripts/generateTimeline.js).
      - name: Fetch GitHub timeline
        if: github.actor != 'dependabot[bot]' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: workingonstudio
          GITHUB_REPO: workingon.studio
        run: npm run timeline:fetch-github

      - name: Build with Astro
        env:
          BROCKMANN_FONT_CSS_URL: ${{ secrets.BROCKMANN_FONT_CSS_URL }}
          UMAMI_ID_PROD: ${{ secrets.UMAMI_ID_PROD }}
          UMAMI_SCRIPT_URL: ${{ secrets.UMAMI_SCRIPT_URL }}
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
