      <line x1="60" y1="50" x2="70" y2="50" stroke="#DBEAFE" stroke-width="6" stroke-linecap="round" />
      <line x1="50" y1="30" x2="50" y2="40" stroke="#DBEAFE" stroke-width="6" stroke-linecap="round" />
